name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop -c npm ci
      - run: nix develop -c npm run lint
      - run: nix develop -c npm run check
      - run: nix develop -c npm run pack
      - run: nix develop -c scripts/check-zip.sh dory@mowerick.github.io.shell-extension.zip
      - run: nix build .#default
