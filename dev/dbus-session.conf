<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <servicedir>dbus-services</servicedir>
  <!-- Most distros ship it in /usr/share; NixOS in /etc. -->
  <include ignore_missing="yes">/usr/share/dbus-1/session.conf</include>
  <include ignore_missing="yes">/etc/dbus-1/session.conf</include>
</busconfig>
